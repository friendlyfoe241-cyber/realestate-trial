<!--
  ============================================================
  WIX EMBED CODE — Scroll-Linked Image Sequence (simple iframe)
  ============================================================
  WHERE TO PASTE:
    Wix Editor → Add (＋) → Embed → "Embed a widget" → "Embed HTML"
    → paste this whole snippet into the "HTML code" box.
    Drag the element to where you want the sequence to begin, then set
    the element HEIGHT to roughly 7× the screen height (e.g. 6000px) —
    that tall height is the scroll distance the sequence scrubs through.

  HOW IT WORKS:
    It's just a normal, scrollable iframe pointing at the Vercel page.
    That page runs GSAP/ScrollTrigger on its OWN document: as you scroll
    the wheel/touch over the iframe, the iframe scrolls and the canvas
    scrubs through all 250 frames (the Apple AirPods technique). No
    postMessage bridge, no parent scripting — the iframe is a
    self-contained player.

  Code size: ~1.4 KB (well under the 15,000 char limit).
  ============================================================
-->

<style>
  #seq-embed-frame {
    display: block;
    width: 100%;
    height: 100vh;          /* visible stage height; the inner page adds its own scroll distance */
    border: 0;
    background: #000;
  }
</style>

<iframe id="seq-embed-frame" title="Scroll Image Sequence"
  src="https://realestate-trial.vercel.app/"
  loading="eager" referrerpolicy="no-referrer-when-downgrade"
  allow="fullscreen"></iframe>
