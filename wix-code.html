<!--
  ============================================================
  WIX EMBED CODE — Scroll-Linked Image Sequence
  ============================================================
  WHERE TO PASTE (best method — places it anywhere on the page):
    Wix Editor → Add (＋) → Embed → "Embed a widget" → "Embed HTML"
    → paste this whole snippet into the "HTML code" box.
    Then drag the HTML element to exactly where you want the sequence,
    and resize its height to ~ your viewport height (e.g. 600–800px on
    desktop, 400–600px on mobile). Because the sequence scrolls *internally*
    inside this box, it does NOT need to be the full 400vh scroll distance —
    one screen of visible height is enough.

  ALTERNATIVE (Wix Settings → Custom Code):
    Wix Editor → Settings → Custom Code → "Add Custom Code"
    → paste this snippet.
    NOTE: the global "Custom Code in Settings" area injects code at the top of
    the page, so the sequence will render at the TOP of the page by default.
    To position it elsewhere, use the "Embed HTML" widget method above —
    that's the reliable way to drop it into any section.

  Code size: ~3.4 KB (well under the 15,000 char limit).
  ============================================================
-->

<style>
  #seq-embed-host {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 520px;
    background: #000;
    overflow: hidden;
    z-index: 9;           /* keep the sequence above surrounding Wix content */
  }
  #seq-embed-host iframe#seq-embed-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
    z-index: 9;
  }
  #seq-embed-host .seq-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: #a1a1aa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 1.5rem;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 10;
  }
  #seq-embed-host .seq-fallback.hidden { opacity: 0; }
  #seq-embed-host .seq-fallback .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: #fff;
    animation: seq-spin 0.9s linear infinite;
  }
  #seq-embed-host .seq-fallback .label {
    font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: #71717a;
  }
  @keyframes seq-spin { to { transform: rotate(360deg); } }
</style>

<div id="seq-embed-host">
  <div class="seq-fallback" id="seq-fallback">
    <div class="spinner"></div>
    <div class="label">Loading sequence</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- Configuration -------------------------------------------------------
  var SRC = "https://realestate-trial.vercel.app/";
  // --------------------------------------------------------------------------

  var host = document.getElementById("seq-embed-host");
  if (!host) return;
  var fb = document.getElementById("seq-fallback");

  var iframe = document.createElement("iframe");
  iframe.id = "seq-embed-frame";
  iframe.title = "Scroll Image Sequence";
  iframe.src = SRC;
  iframe.allow = "fullscreen";
  iframe.setAttribute("loading", "eager");
  iframe.setAttribute("scrolling", "no");
  iframe.referrerPolicy = "no-referrer-when-downgrade";

  iframe.addEventListener("load", function () {
    // The inner page fires load only after its 250 inline frames finish
    // preloading, so this is a good "fully ready" signal.
    if (fb) {
      fb.classList.add("hidden");
      setTimeout(function () { if (fb && fb.parentNode) fb.parentNode.removeChild(fb); }, 600);
    }
  });

  // Safety fallback: hide the spinner after 25s even on a slow/cold start;
  // the section stays so visitors can scroll the iframe content once it arrives.
  setTimeout(function () {
    if (fb && !fb.classList.contains("hidden")) {
      fb.classList.add("hidden");
      setTimeout(function () { if (fb && fb.parentNode) fb.parentNode.removeChild(fb); }, 600);
    }
  }, 25000);

  host.appendChild(iframe);
})();
</script>
